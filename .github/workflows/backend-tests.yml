name: Backend tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend and test dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Run backend tests
        env:
          PYTHONPATH: backend
        run: python -m pytest -q backend/tests
